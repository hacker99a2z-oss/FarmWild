services:
  - type: web
    name: farm-city-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: farmcity
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TON_WALLET_MNEMONIC
        sync: false
      - key: TON_WALLET_VERSION
        value: v5r1
      - key: TONCENTER_API_KEY
        sync: false
      - key: PAYOUT_CRON_SECRET
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: PAYMENTS_PROOF_URL
        sync: false
      - key: CONTACT_SUPPORT_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
